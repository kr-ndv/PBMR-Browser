name: PBMR Browser Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build universal debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare standalone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Universal APK was not produced. Available APK files:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK_PATH" dist/PBMR-Browser.apk
          ls -lh dist/PBMR-Browser.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: PBMR-Browser-Standalone-APK
          path: dist/PBMR-Browser.apk
          if-no-files-found: error
          retention-days: 14
